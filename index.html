
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solar System AR</title>

    <link rel="stylesheet" href="style.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <!-- Welcome screen -->
    <main class="welcome" id="welcome-screen">

        <h1>Solar System AR</h1>

        <p class="welcome-description">
            Discover the wonders of our solar system
            through augmented reality.
        </p>

        <p class="subtitle">
            Choose a planet to begin your exploration!
        </p>

        <!-- Planet selection -->
        <div class="planet-selection">

            <button class="planet-card selected" data-planet="0" type="button">
                <span class="planet-icon earth-icon"></span>
                <span class="planet-name">EARTH</span>
                <span class="planet-description">Our home planet</span>
            </button>

            <button class="planet-card" data-planet="1" type="button">
                <span class="planet-icon mars-icon"></span>
                <span class="planet-name">MARS</span>
                <span class="planet-description">The Red Planet</span>
            </button>

            <button class="planet-card" data-planet="2" type="button">
                <span class="planet-icon jupiter-icon"></span>
                <span class="planet-name">JUPITER</span>
                <span class="planet-description">The largest planet</span>
            </button>

            <button class="planet-card" data-planet="3" type="button">
                <span class="planet-icon saturn-icon"></span>
                <span class="planet-name">SATURN</span>
                <span class="planet-description">The ringed planet</span>
            </button>

        </div>

        <p id="selection-message">
            Selected planet: EARTH
        </p>

        <button id="start-button" type="button">
            Start Experience
        </button>

    </main>

    <!-- AR container -->
    <div id="ar-container" class="ar-hidden">

        <!-- Scan instructions -->
        <div id="scan-ui" class="scan-ui">

            <p id="scan-instructions">
                Point your camera at the EARTH card
            </p>

            <p id="scan-status">
                Searching for EARTH...
            </p>

        </div>

        <a-scene
            mindar-image="imageTargetSrc: assets/targets/targets.mind; autoStart: false; filterMinCF: 0.0001; filterBeta: 10;"
            embedded
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <!-- Planet textures -->
            <a-assets>

                <img id="earthTexture" src="assets/textures/2k_earth.jpg">
                <img id="marsTexture" src="assets/textures/2k_mars.jpg">
                <img id="jupiterTexture" src="assets/textures/2k_jupiter.jpg">
                <img id="saturnTexture" src="assets/textures/2k_saturn.jpg">

            </a-assets>

            <!-- Camera -->
            <a-camera
                position="0 0 0"
                look-controls="enabled: false">
            </a-camera>


            <!-- EARTH - TARGET 0 -->
            <a-entity mindar-image-target="targetIndex: 0">

                <a-entity class="planet-content" visible="false">

                    <a-sphere
                        radius="0.5"
                        material="src: #earthTexture; roughness: 1"
                        animation="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true">
                    </a-sphere>

                    <a-plane
                        position="0 1.05 0.02"
                        width="1.7"
                        height="0.65"
                        material="color: #10243D; opacity: 0.9; transparent: true; side: double">
                    </a-plane>

                    <a-text
                        value="EARTH&#10;Our home planet&#10;About 71% of its surface is covered by water."
                        position="0 1.05 0.04"
                        align="center"
                        color="#FFFFFF"
                        width="2.3"
                        scale="0.7 0.7 0.7">
                    </a-text>
                </a-entity>
            </a-entity>


            <!-- MARS - TARGET 1 -->
            <a-entity mindar-image-target="targetIndex: 1">

                <a-entity class="planet-content" visible="false">

                    <a-sphere
                        radius="0.5"
                        material="src: #marsTexture; roughness: 1"
                        animation="property: rotation; to: 0 360 0; dur: 18000; easing: linear; loop: true">
                    </a-sphere>

                    <a-plane
                        position="0 1.05 0.02"
                        width="1.7"
                        height="0.65"
                        material="color: #10243D; opacity: 0.9; transparent: true; side: double">
                    </a-plane>

                    <a-text
                        value="MARS&#10;The Red Planet&#10;It has the largest volcano in the solar system."
                        position="0 1.05 0.04"
                        align="center"
                        color="#FFFFFF"
                        width="2.3"
                        scale="0.7 0.7 0.7">
                    </a-text>

                </a-entity>

            </a-entity>


            <!-- JUPITER - TARGET 2 -->
            <a-entity mindar-image-target="targetIndex: 2">

                <a-entity class="planet-content" visible="false">

                    <a-sphere
                        radius="0.65"
                        material="src: #jupiterTexture; roughness: 1"
                        animation="property: rotation; to: 0 360 0; dur: 25000; easing: linear; loop: true">
                    </a-sphere>

                    <a-plane
                        position="0 1.25 0.02"
                        width="1.7"
                        height="0.65"
                        material="color: #10243D; opacity: 0.9; transparent: true; side: double">
                    </a-plane>

                    <a-text
                        value="JUPITER&#10;The Largest Planet&#10;It has a giant storm called the Great Red Spot."
                        position="0 1.25 0.04"
                        align="center"
                        color="#FFFFFF"
                        width="2.3"
                        scale="0.7 0.7 0.7">
                    </a-text>
                </a-entity>
            </a-entity>


            <!-- SATURN - TARGET 3 -->
            <a-entity mindar-image-target="targetIndex: 3">

                <a-entity class="planet-content" visible="false">

                    <a-entity
                        position="0 0 0"
                        scale="0.65 0.65 0.65"
                        animation="property: rotation; to: 0 360 0; dur: 60000; easing: linear; loop: true">

                        <a-sphere
                            radius="0.5"
                            material="src: #saturnTexture; roughness: 1">
                        </a-sphere>

                        <a-ring
                            radius-inner="0.62"
                            radius-outer="1.05"
                            rotation="75 0 0"
                            material="color: #D8C49A; side: double; opacity: 0.85; transparent: true">
                        </a-ring>

                        <a-ring
                            radius-inner="1.06"
                            radius-outer="1.16"
                            rotation="75 0 0"
                            material="color: #A88A60; side: double; opacity: 0.65; transparent: true">
                        </a-ring>

                    </a-entity>

                    <a-plane
                        position="0 1.05 0.02"
                        width="1.7"
                        height="0.65"
                        material="color: #10243D; opacity: 0.9; transparent: true; side: double">
                    </a-plane>

                    <a-text
                        value="SATURN&#10;The Ringed Planet&#10;Its rings are made mostly of ice and rock."
                        position="0 1.05 0.04"
                        align="center"
                        color="#FFFFFF"
                        width="2.3"
                        scale="0.7 0.7 0.7">
                    </a-text>
                </a-entity>

            </a-entity>

        </a-scene>

    </div>

    <!-- Exit AR button -->
    <button id="exit-button" class="exit-button" type="button">
        Exit AR
    </button>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>

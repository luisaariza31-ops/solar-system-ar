
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solar System AR</title>

    <link rel="stylesheet" href="style.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <!-- Welcome screen -->
    <main class="welcome" id="welcome-screen">

        <h1>Solar System AR</h1>

        <p>
            Discover the wonders of our solar system
            through augmented reality.
        </p>

        <p class="subtitle">
            Explore Earth, Mars, Jupiter and Saturn!
        </p>

        <button id="start-button">
            Start Experience
        </button>

    </main>

    <!-- AR container -->
    <div id="ar-container" class="ar-hidden">

        <a-scene
            mindar-image="imageTargetSrc: assets/targets/targets.mind; autoStart: false; filterMinCF: 0.0001; filterBeta: 10;"
            embedded
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <!-- Planet textures -->
            <a-assets>

                <img id="earthTexture"
                     src="assets/textures/2k_earth.jpg">

                <img id="marsTexture"
                     src="assets/textures/2k_mars.jpg">

                <img id="jupiterTexture"
                     src="assets/textures/2k_jupiter.jpg">

                <img id="saturnTexture"
                     src="assets/textures/2k_saturn.jpg">

            </a-assets>

            <!-- Camera -->
            <a-camera
                position="0 0 0"
                look-controls="enabled: false">
            </a-camera>

            <!-- EARTH -->
            <a-entity mindar-image-target="targetIndex: 0">

                <a-sphere
                    radius="0.5"
                    material="src: #earthTexture; roughness: 1"
                    animation="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true">
                </a-sphere>

            </a-entity>

            <!-- MARS -->
            <a-entity mindar-image-target="targetIndex: 1">

                <a-sphere
                    radius="0.5"
                    material="src: #marsTexture; roughness: 1"
                    animation="property: rotation; to: 0 360 0; dur: 18000; easing: linear; loop: true">
                </a-sphere>

            </a-entity>

            <!-- JUPITER -->
            <a-entity mindar-image-target="targetIndex: 2">

                <a-sphere
                    radius="0.65"
                    material="src: #jupiterTexture; roughness: 1"
                    animation="property: rotation; to: 0 360 0; dur: 25000; easing: linear; loop: true">
                </a-sphere>

            </a-entity>

            
            <!-- SATURN -->
            <a-entity mindar-image-target="targetIndex: 3">

                <!-- Saturn group -->
                <a-entity
                    position="0 0 0"
                    scale="0.65 0.65 0.65"
                    animation="property: rotation; to: 0 360 0; dur: 60000; easing: linear; loop: true">

                    <!-- Saturn planet -->
                    <a-sphere
                        radius="0.5"
                        material="src: #saturnTexture; roughness: 1">
                    </a-sphere>

                    <!-- Saturn flat rings -->
                    <a-ring
                        radius-inner="0.62"
                        radius-outer="1.05"
                        rotation="75 0 0"
                        material="color: #D8C49A; side: double; opacity: 0.85; transparent: true">
                    </a-ring>

                    <a-ring
                        radius-inner="1.06"
                        radius-outer="1.16"
                        rotation="75 0 0"
                        material="color: #A88A60; side: double; opacity: 0.65; transparent: true">
                    </a-ring>

                </a-entity>

            </a-entity>


        </a-scene>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
